name: 몽산포 물때 갱신
on:
  schedule:
    - cron: "0 20 * * *"   # 매일 한국시간 05:00
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 물때 받아서 tide.ics 만들기
        env:
          KHOA_KEY: ${{ secrets.KHOA_KEY }}
          OBS_CODES: "DT_0067,DT_0050,DT_0025"
          DAYS: "60"
        run: |
          python3 - <<'PY'
          import os, re, json, time, urllib.request, urllib.parse, urllib.error, datetime as dt
          key = urllib.parse.unquote(os.environ["KHOA_KEY"].strip())
          base = "https://apis.data.go.kr/1192136/tideFcstHghLw/GetTideFcstHghLwApiService"
          kst = dt.timezone(dt.timedelta(hours=9))
          today = dt.datetime.now(kst).date()
          def call(code, day):
              q = urllib.parse.urlencode({"serviceKey": key, "obsCode": code, "reqDate": day.strftime("%Y%m%d"),
                                          "type": "json", "pageNo": 1, "numOfRows": 100})
              for n in range(5):
                  try:
                      time.sleep(1)
                      raw = urllib.request.urlopen(base + "?" + q, timeout=30).read().decode("utf-8")
                      break
                  except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as e:
                      print(day, "재시도", n + 1, e)
                      time.sleep(5 * (n + 1))
              else:
                  print(day, "건너뜀")
                  return []
              try:
                  j = json.loads(raw)
              except ValueError:
                  raise SystemExit("JSON 아님 (키/파라미터 문제일 수 있음): " + raw[:500])
              r = j.get("response", j)
              h = r.get("header", {})
              if str(h.get("resultCode", "00")) not in ("00", "0"):
                  raise SystemExit(f"API 오류 {h}")
              items = (r.get("body") or {}).get("items") or []
              if isinstance(items, dict): items = items.get("item") or []
              if isinstance(items, dict): items = [items]
              return items
          code = name = None
          for c in os.environ["OBS_CODES"].split(","):
              it = call(c.strip(), today)
              print(c, "->", len(it), "건", it[:1])
              if it:
                  code, name = c.strip(), it[0].get("obsvtrNm", c); break
          if not code: raise SystemExit("어느 관측소에서도 데이터가 없습니다")
          print("사용 관측소:", code, name)
          ev = {}
          for i in range(int(os.environ["DAYS"])):
              for x in call(code, today + dt.timedelta(days=i)):
                  ds = re.sub(r"\D", "", str(x.get("predcDt", "")))[:12]
                  if len(ds) < 12: continue
                  t = dt.datetime.strptime(ds, "%Y%m%d%H%M")
                  se = str(x.get("extrSe", ""))
                  high = se in ("1", "3") or "고" in se or "만" in se
                  lvl = x.get("predcTdlvVl")
                  ev[t] = (high, None if lvl in (None, "") else round(float(lvl)))
          if len(ev) < 20: raise SystemExit(f"데이터가 너무 적습니다: {len(ev)}건")
          stamp = dt.datetime.now(dt.timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//sizblue1//mongsanpo-tide//KO", "CALSCALE:GREGORIAN",
               "METHOD:PUBLISH", "X-WR-CALNAME:몽산포 물때", "X-WR-TIMEZONE:Asia/Seoul",
               "REFRESH-INTERVAL;VALUE=DURATION:PT12H", "X-PUBLISHED-TTL:PT12H",
               "BEGIN:VTIMEZONE", "TZID:Asia/Seoul", "BEGIN:STANDARD", "DTSTART:19700101T000000",
               "TZOFFSETFROM:+0900", "TZOFFSETTO:+0900", "TZNAME:KST", "END:STANDARD", "END:VTIMEZONE"]
          f = lambda t: t.strftime("%Y%m%dT%H%M%S")
          for t in sorted(ev):
              high, lvl = ev[t]
              nm = "만조" if high else "간조"
              cm = f" {lvl}cm" if lvl is not None else ""
              L += ["BEGIN:VEVENT", f"UID:{'H' if high else 'L'}-{t:%Y%m%d%H%M}@mongsanpo-tide", f"DTSTAMP:{stamp}",
                    f"DTSTART;TZID=Asia/Seoul:{f(t)}", f"DTEND;TZID=Asia/Seoul:{f(t + dt.timedelta(minutes=30))}",
                    f"SUMMARY:{'▲' if high else '▼'}{nm}{cm}",
                    f"DESCRIPTION:{name} 관측소 예보 (국립해양조사원)",
                    "LOCATION:몽산포해수욕장", "TRANSP:TRANSPARENT", "END:VEVENT"]
          L.append("END:VCALENDAR")
          open("tide.ics", "w", encoding="utf-8", newline="").write("\r\n".join(L) + "\r\n")
          print("완료:", len(ev), "건,", min(ev), "~", max(ev))
          PY
      - name: 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add tide.ics
          git diff --cached --quiet || git commit -m "물때 갱신 $(date -u +%F)"
          git push
